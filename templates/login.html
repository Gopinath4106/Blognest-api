{% extends "base.html" %}
{% block title %}Login — AI Blog Nest{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <h2>Welcome back</h2>
    <p class="auth-subtitle">Log in to manage and generate your blogs.</p>
    <form method="post" action="{{ url_for('login') }}" class="form">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" value="{{ email or '' }}" required>

      <label for="password">Password</label>
      <input type="password" id="password" name="password" required>

      <button type="submit" class="btn btn-primary btn-block">Login</button>
    </form>
    <p class="auth-switch">Don't have an account? <a href="{{ url_for('register') }}">Sign up</a></p>
  </div>
</div>
{% endblock %}
