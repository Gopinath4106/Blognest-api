{% extends "base.html" %}
{% block title %}Sign Up — AI Blog Nest{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <h2>Create your account</h2>
    <p class="auth-subtitle">Join AI Blog Nest and start generating blogs in minutes.</p>
    <form method="post" action="{{ url_for('register') }}" class="form">
      <label for="name">Full Name</label>
      <input type="text" id="name" name="name" value="{{ name or '' }}" required>

      <label for="email">Email</label>
      <input type="email" id="email" name="email" value="{{ email or '' }}" required>

      <label for="password">Password</label>
      <input type="password" id="password" name="password" minlength="6" required>

      <label for="confirm_password">Confirm Password</label>
      <input type="password" id="confirm_password" name="confirm_password" minlength="6" required>

      <button type="submit" class="btn btn-primary btn-block">Create Account</button>
    </form>
    <p class="auth-switch">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
  </div>
</div>
{% endblock %}
