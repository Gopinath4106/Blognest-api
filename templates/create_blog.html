{% extends "base.html" %}
{% block title %}Create Blog — AI Blog Nest{% endblock %}
{% block content %}

<div class="page-header">
  <h1>Create a New Blog</h1>
  <p>Write manually, or use the <a href="{{ url_for('generate') }}">AI Generator</a> to get a head start.</p>
</div>

<div class="form-card">
  <form method="post" action="{{ url_for('create_blog') }}" class="form">
    <label for="title">Blog Title</label>
    <input type="text" id="title" name="title" value="{{ title or '' }}" required>

    <div class="form-row">
      <div>
        <label for="category">Category</label>
        <select id="category" name="category">
          {% for c in categories %}
            <option value="{{ c }}" {% if category == c %}selected{% endif %}>{{ c }}</option>
          {% endfor %}
        </select>
      </div>
      <div>
        <label for="tags">Tags (comma separated)</label>
        <input type="text" id="tags" name="tags" value="{{ tags or '' }}" placeholder="e.g. security, awareness, tips">
      </div>
    </div>

    <label for="content">Content</label>
    <textarea id="content" name="content" rows="16" required>{{ content or '' }}</textarea>
    <p class="field-hint">Basic HTML tags like &lt;h3&gt; and &lt;p&gt; are supported.</p>

    <div class="form-actions">
      <button type="submit" name="action" value="draft" class="btn btn-outline">Save as Draft</button>
      <button type="submit" name="action" value="publish" class="btn btn-primary">Publish</button>
    </div>
  </form>
</div>

{% endblock %}
